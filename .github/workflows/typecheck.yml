name: Lua Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_call:

jobs:
  verify:
    name: Typecheck & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Lua 5.1
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1.5"

      - name: Run Syntax Check
        run: luac -p core/*.lua ui/*.lua types.lua tests/test_consolidator.lua

      - name: Run Unit Tests
        run: lua tests/test_consolidator.lua

      - name: Setup types
        run: bash scripts/setup_types.sh

      - name: Lua Typecheck
        uses: mrcjkb/lua-typecheck-action@v1.1.0
        with:
          checklevel: Warning
